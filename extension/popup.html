<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ステップ侍 レビュー取込</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="wrap popup">
  <h1>ステップ侍 レビュー取込</h1>
  <div id="status" class="status info"><span id="level" class="badge info"></span> <strong id="headline"></strong></div>
  <p id="detail"></p>
  <p class="muted">最後に成功した日時: <span id="last"></span></p>
  <div class="row">
    <button id="sync" type="button">今すぐ取り込む</button>
    <button id="openrms" type="button" class="secondary">RMSを開く</button>
    <a id="settings" href="#">設定を開く</a>
  </div>
  <p id="result" class="muted"></p>
</div>
<script src="lib/config.js"></script>
<script src="lib/time.js"></script>
<script src="lib/state.js"></script>
<script src="popup.js"></script>
</body>
</html>
